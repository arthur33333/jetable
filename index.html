<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TempMailGo — Email Temporaire Gratuit</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; color: white; margin-bottom: 30px; }
        header h1 { font-size: 2.5em; margin-bottom: 10px; }
        header p { opacity: 0.9; font-size: 1.1em; }
        .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); margin-bottom: 20px; }
        .email-box { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .email-display { flex: 1; background: #f0f4ff; padding: 15px 20px; border-radius: 10px; font-size: 1.2em; font-weight: 600; color: #4a5568; border: 2px dashed #667eea; word-break: break-all; min-width: 250px; }
        .btn { padding: 15px 25px; border: none; border-radius: 10px; font-size: 1em; font-weight: 600; cursor: pointer; transition: all 0.3s; color: white; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
        .btn-secondary { background: #48bb78; }
        .btn-secondary:hover { background: #38a169; transform: translateY(-2px); }
        .btn-small { padding: 8px 15px; font-size: 0.85em; }
        .inbox-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .inbox-header h2 { color: #2d3748; }
        .email-list { display: flex; flex-direction: column; gap: 10px; }
        .email-item { padding: 15px; background: #f7fafc; border-radius: 10px; border-left: 4px solid #667eea; cursor: pointer; transition: all 0.2s; }
        .email-item:hover { background: #edf2f7; transform: translateX(5px); }
        .email-from { font-weight: 600; color: #2d3748; margin-bottom: 5px; }
        .email-subject { color: #4a5568; margin-bottom: 5px; }
        .email-date { font-size: 0.85em; color: #a0aec0; }
        .empty-state { text-align: center; padding: 40px; color: #a0aec0; }
        .empty-state .icon { font-size: 3em; margin-bottom: 10px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 15px; padding: 30px; max-width: 700px; width: 100%; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 20px; gap: 15px; }
        .modal-header h3 { color: #2d3748; word-break: break-word; }
        .close-btn { background: #f56565; color: white; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; font-size: 1.2em; flex-shrink: 0; }
        .modal-body { color: #4a5568; line-height: 1.6; word-break: break-word; }
        .modal-meta { font-size: 0.9em; color: #718096; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #e2e8f0; }
        .toast { position: fixed; bottom: 30px; right: 30px; background: #2d3748; color: white; padding: 15px 25px; border-radius: 10px; z-index: 2000; animation: slideIn 0.3s; max-width: 300px; }
        @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .loading { text-align: center; padding: 30px; color: #667eea; }
        .spinner { border: 3px solid #f0f4ff; border-top: 3px solid #667eea; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error-box { background: #fed7d7; color: #c53030; padding: 15px; border-radius: 10px; margin-top: 10px; font-size: 0.9em; }
        @media (max-width: 600px) { header h1 { font-size: 1.8em; } .email-display { font-size: 1em; padding: 12px; } .btn { padding: 12px 18px; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📧 TempMailGo</h1>
            <p>Générateur d'adresses email temporaires</p>
        </header>

        <div class="card">
            <div class="email-box">
                <div class="email-display" id="emailDisplay">Chargement...</div>
                <button class="btn btn-primary" onclick="copyEmail()">📋 Copier</button>
                <button class="btn btn-secondary" onclick="generateNewEmail()">🔄 Nouveau</button>
            </div>
            <div id="errorMsg"></div>
        </div>

        <div class="card">
            <div class="inbox-header">
                <h2>📥 Boîte de réception</h2>
                <button class="btn btn-primary btn-small" onclick="loadMessages()">🔄 Actualiser</button>
            </div>
            <div id="emailList" class="email-list">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Chargement des messages...</p>
                </div>
            </div>
        </div>
    </div>
    <p style="text-align:center;color:white;font-size:0.9em;margin:10px auto 20px;">Service de messagerie fourni par <a href="https://mail.tm/" target="_blank" rel="noopener noreferrer" style="color:white;text-decoration:underline;">Mail.tm</a>.</p>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalSubject"></h3>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-meta" id="modalMeta"></div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        // TempMailGo utilise l'API publique Mail.tm.
        // Attribution requise : lien vers https://mail.tm/
        const API_BASE = 'https://api.mail.tm';
        let currentEmail = null;
        let currentToken = null;
        let refreshTimer = null;
        let isGenerating = false;

        window.addEventListener('DOMContentLoaded', async () => {
            await generateNewEmail();
            if (refreshTimer) clearInterval(refreshTimer);
            refreshTimer = setInterval(() => {
                if (currentToken) loadMessages();
            }, 15000);
        });

        async function apiRequest(path, options = {}) {
            const headers = {
                'Accept': 'application/json',
                ...(options.headers || {})
            };
            if (options.body) headers['Content-Type'] = 'application/json';
            if (options.auth && currentToken) {
                headers['Authorization'] = `Bearer ${currentToken}`;
            }

            const response = await fetch(`${API_BASE}${path}`, {
                method: options.method || 'GET',
                headers,
                body: options.body ? JSON.stringify(options.body) : undefined
            });

            if (!response.ok) {
                let detail = '';
                try {
                    const data = await response.json();
                    detail = data.detail || data.message || data['hydra:description'] || '';
                } catch (_) {}
                if (response.status === 429) {
                    throw new Error('Trop de demandes. Attendez une minute avant de réessayer.');
                }
                if (response.status === 422) {
                    throw new Error(detail || 'Adresse refusée par le service. Réessayez.');
                }
                throw new Error(detail || `Erreur du service (HTTP ${response.status}).`);
            }

            if (response.status === 204) return null;
            return response.json();
        }

        function showError(msg) {
            const box = document.getElementById('errorMsg');
            box.textContent = '';
            const error = document.createElement('div');
            error.className = 'error-box';
            error.textContent = `⚠️ ${msg}`;
            box.appendChild(error);
        }

        function clearError() {
            document.getElementById('errorMsg').textContent = '';
        }

        async function generateNewEmail() {
            if (isGenerating) return;
            isGenerating = true;
            clearError();
            currentEmail = null;
            currentToken = null;
            document.getElementById('emailDisplay').textContent = 'Création de l’adresse…';
            document.getElementById('emailList').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Connexion au service de messagerie…</p>
                </div>`;

            try {
                const domainResponse = await apiRequest('/domains');
                const domains = (domainResponse['hydra:member'] || [])
                    .filter(item => item.isActive && !item.isPrivate && item.domain);

                if (!domains.length) {
                    throw new Error('Aucun domaine disponible pour le moment.');
                }

                // Crée une adresse aléatoire sur un domaine actuellement disponible.
                const domain = domains[Math.floor(Math.random() * domains.length)].domain;
                const username = 'tg' + randomString(12);
                const password = randomString(24) + 'A9!x';
                const address = `${username}@${domain}`;

                await apiRequest('/accounts', {
                    method: 'POST',
                    body: { address, password }
                });

                const auth = await apiRequest('/token', {
                    method: 'POST',
                    body: { address, password }
                });

                if (!auth.token) throw new Error('Le service n’a pas fourni de jeton de connexion.');

                currentEmail = address;
                currentToken = auth.token;
                document.getElementById('emailDisplay').textContent = currentEmail;
                document.getElementById('emailList').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>Aucun message pour le moment.</p>
                        <p style="font-size:0.9em;margin-top:10px;">Les nouveaux messages seront vérifiés automatiquement.</p>
                    </div>`;
                showToast('✅ Nouvelle adresse créée !');
                await loadMessages();
            } catch (error) {
                console.error('Erreur de création de boîte :', error);
                document.getElementById('emailDisplay').textContent = 'Erreur de connexion';
                document.getElementById('emailList').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⚠️</div>
                        <p>Impossible de charger la boîte de réception.</p>
                        <p style="font-size:0.9em;margin-top:10px;">Vérifiez votre connexion puis cliquez sur « Nouveau ».</p>
                    </div>`;
                showError(error.message || 'Impossible de joindre le service de messagerie.');
            } finally {
                isGenerating = false;
            }
        }

        function randomString(length) {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            const bytes = new Uint8Array(length);
            if (window.crypto && window.crypto.getRandomValues) {
                window.crypto.getRandomValues(bytes);
                for (const byte of bytes) result += chars[byte % chars.length];
            } else {
                for (let i = 0; i < length; i++) {
                    result += chars[Math.floor(Math.random() * chars.length)];
                }
            }
            return result;
        }

        async function copyEmail() {
            if (!currentEmail) {
                showToast('Créez d’abord une adresse e-mail.');
                return;
            }
            try {
                await navigator.clipboard.writeText(currentEmail);
                showToast('✅ Adresse copiée !');
            } catch (_) {
                const ta = document.createElement('textarea');
                ta.value = currentEmail;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                const copied = document.execCommand('copy');
                ta.remove();
                showToast(copied ? '✅ Adresse copiée !' : 'Copie impossible dans ce navigateur.');
            }
        }

        async function loadMessages() {
            const list = document.getElementById('emailList');
            if (!currentToken) return;

            try {
                const data = await apiRequest('/messages', { auth: true });
                const messages = data['hydra:member'] || [];
                renderMessages(messages);
            } catch (error) {
                console.error('Erreur de chargement des messages :', error);
                if (!list.querySelector('.email-item')) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">⚠️</div>
                            <p>La boîte n’a pas pu être actualisée.</p>
                            <p style="font-size:0.9em;margin-top:10px;">Réessayez dans quelques instants.</p>
                        </div>`;
                }
            }
        }

        function renderMessages(messages) {
            const list = document.getElementById('emailList');
            if (!Array.isArray(messages) || messages.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>Aucun message pour le moment.</p>
                    </div>`;
                return;
            }

            list.innerHTML = '';
            messages.forEach(msg => {
                const item = document.createElement('div');
                item.className = 'email-item';
                item.tabIndex = 0;
                item.setAttribute('role', 'button');

                const from = document.createElement('div');
                from.className = 'email-from';
                from.textContent = `De : ${formatSender(msg.from)}`;

                const subject = document.createElement('div');
                subject.className = 'email-subject';
                subject.textContent = msg.subject || '(Sans sujet)';

                const date = document.createElement('div');
                date.className = 'email-date';
                date.textContent = formatDate(msg.createdAt);

                item.append(from, subject, date);
                item.addEventListener('click', () => openMessage(msg.id));
                item.addEventListener('keydown', e => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        openMessage(msg.id);
                    }
                });
                list.appendChild(item);
            });
        }

        function formatSender(from) {
            if (!from) return 'Inconnu';
            if (typeof from === 'string') return from;
            return from.name ? `${from.name} <${from.address || ''}>` : (from.address || 'Inconnu');
        }

        function formatDate(value) {
            if (!value) return 'Date inconnue';
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString('fr-FR');
        }

        async function openMessage(id) {
            if (!currentToken || !id) return;
            try {
                const msg = await apiRequest(`/messages/${encodeURIComponent(id)}`, { auth: true });
                document.getElementById('modalSubject').textContent = msg.subject || '(Sans sujet)';
                document.getElementById('modalMeta').textContent =
                    `De : ${formatSender(msg.from)} · Date : ${formatDate(msg.createdAt)}`;

                // Affiche le contenu comme texte afin de ne pas exécuter de code HTML reçu par e-mail.
                const body = document.getElementById('modalBody');
                body.textContent = '';
                let content = msg.text || '';
                if (!content && Array.isArray(msg.html)) {
                    content = msg.html.join('\n').replace(/<style[\s\S]*?<\/style>/gi, '')
                        .replace(/<script[\s\S]*?<\/script>/gi, '')
                        .replace(/<[^>]+>/g, ' ')
                        .replace(/&nbsp;/gi, ' ')
                        .replace(/&amp;/gi, '&')
                        .replace(/&lt;/gi, '<')
                        .replace(/&gt;/gi, '>')
                        .replace(/&quot;/gi, '"')
                        .replace(/&#39;/gi, "'");
                } else if (Array.isArray(content)) {
                    content = content.join('\n');
                }
                body.style.whiteSpace = 'pre-wrap';
                body.textContent = content || '(Message vide)';
                document.getElementById('modal').classList.add('active');
            } catch (error) {
                console.error('Erreur de lecture :', error);
                showToast(error.message || 'Impossible d’ouvrir ce message.');
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        document.getElementById('modal').addEventListener('click', e => {
            if (e.target.id === 'modal') closeModal();
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
        });

        function showToast(message) {
            const previous = document.querySelector('.toast');
            if (previous) previous.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
